            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover { background-color: var(--border); }
        
        .section {
            padding: 60px 0;
            border-top: 1px solid var(--border);
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
        }
        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #fff;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

            display: grid;

            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }
